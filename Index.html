<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Геометричні фігури — 2 клас</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-drag: none; }
        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            margin: 0; padding: 20px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #2c3e50;
        }
        .title-box {
            background: white; padding: 20px 50px; border-radius: 25px; border: 4px solid #81c784;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1); text-align: center; margin-bottom: 40px;
        }
        .title-box h1 { margin: 0 0 8px 0; font-size: 36px; color: #2e7d32; }
        .title-box p { margin: 0; font-size: 18px; color: #d84315; font-weight: bold; }
        .cards { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
        .card {
            position: relative; width: 260px; padding: 30px 20px; background: white;
            border: 5px solid #4fc3f7; border-radius: 30px; text-align: center;
            text-decoration: none; color: #2c3e50; box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transition: 0.25s;
        }
        .card:hover { transform: translateY(-8px) scale(1.04); border-color: #ff9800; }
        .card .emoji { font-size: 90px; line-height: 1.1; }
        .card .name { font-size: 28px; font-weight: bold; margin-top: 12px; color: #1565c0; }
        .card .num { font-size: 16px; color: #78909c; margin-top: 4px; }
        .card .star { position: absolute; top: 10px; right: 16px; font-size: 34px; display: none; }
        .card.done { border-color: #66bb6a; }
        .card.done .star { display: block; }
        .reset {
            margin-top: 40px; padding: 8px 16px; background: transparent; color: #90a4ae;
            border: 2px dashed #b0bec5; border-radius: 10px; cursor: pointer;
            font-family: inherit; font-size: 14px;
        }
        .reset:hover { color: #e53935; border-color: #e53935; }
    </style>
</head>
<body>
    <div class="title-box">
        <h1>Геометричні фігури 📐</h1>
        <p>Обери завдання і збери картинку з паличок!</p>
    </div>

    <div class="cards">
        <a class="card" id="card4" href="2клас_Листочок.html">
            <div class="star">⭐</div>
            <div class="emoji">🌿</div>
            <div class="name">Листочок</div>
            <div class="num">Завдання 1</div>
        </a>
        <a class="card" id="card5" href="2клас_Квіточка.html">
            <div class="star">⭐</div>
            <div class="emoji">🌷</div>
            <div class="name">Квіточка</div>
            <div class="num">Завдання 2</div>
        </a>
        <a class="card" id="card6" href="2клас_Машинка.html">
            <div class="star">⭐</div>
            <div class="emoji">🚗</div>
            <div class="name">Машинка</div>
            <div class="num">Завдання 3</div>
        </a>
    </div>

    <button class="reset" onclick="resetStars()">Скинути зірочки</button>

    <script>
        function isDone(n) {
            try { return localStorage.getItem('geo2_done_' + n) === '1'; } catch (e) { return false; }
        }
        function refresh() {
            [4, 5, 6].forEach(n => document.getElementById('card' + n).classList.toggle('done', isDone(n)));
        }
        function resetStars() {
            try { [4, 5, 6].forEach(n => localStorage.removeItem('geo2_done_' + n)); } catch (e) {}
            refresh();
        }
        window.addEventListener('pageshow', refresh);
        refresh();
    </script>
</body>
</html>
